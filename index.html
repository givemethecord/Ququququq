<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Order Book</title>
  <style>
    body { background-color: #131722; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 8px; font-weight: bold; background: #2a2e39; margin-bottom: 10px; border-radius: 4px; }
    .container { display: flex; flex-direction: column; gap: 10px; }
    .board { background: #1e222d; padding: 10px; border-radius: 4px; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; font-family: monospace; font-size: 14px; }
    .ask { color: #f23645; }
    .bid { color: #089981; }
  </style>
</head>
<body>

  <div id="status">연결 시도 중...</div>

  <div class="container">
    <div class="board">
      <h4 style="margin:0 0 5px 0; color:#f23645;">매도 잔량 (Asks)</h4>
      <div id="asks"></div>
    </div>
    <div class="board">
      <h4 style="margin:0 0 5px 0; color:#089981;">매수 잔량 (Bids)</h4>
      <div id="bids"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const asksEl = document.getElementById('asks');
    const bidsEl = document.getElementById('bids');

    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@depth10@100ms');

    ws.onopen = () => {
      statusEl.innerText = "✅ 바이낸스 실시간 연결 성공!";
      statusEl.style.color = "#089981";
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (!data.bids || !data.asks) return;

      asksEl.innerHTML = data.asks.slice(0, 5).reverse().map(item => 
        `<div class="row ask"><span>${parseFloat(item[0]).toFixed(2)}</span><span>${parseFloat(item[1]).toFixed(4)}</span></div>`
      ).join('');

      bidsEl.innerHTML = data.bids.slice(0, 5).map(item => 
        `<div class="row bid"><span>${parseFloat(item[0]).toFixed(2)}</span><span>${parseFloat(item[1]).toFixed(4)}</span></div>`
      ).join('');
    };

    ws.onerror = (err) => {
      statusEl.innerText = "❌ 연결 에러 발생 (네트워크 확인 필요)";
      statusEl.style.color = "#f23645";
    };

    ws.onclose = () => {
      statusEl.innerText = "⚠️ 연결 종료됨";
      statusEl.style.color = "#f7a600";
    };
  </script>
</body>
</html>
