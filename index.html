<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Perfect Bookmap Overlay</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 8px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; color: #089981; }
    
    .timeframe-bar {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .tf-btn {
      background: #1e222d; border: 1px solid #2a2e39; color: #d1d4dc; padding: 4px 12px; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .tf-btn.active { background: #089981; border-color: #089981; color: #fff; font-weight: bold; }

    .chart-container {
      position: relative;
      width: 100%;
      height: 500px;
      background: #05070a;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      overflow: hidden;
    }
    
    #tv-chart {
      width: 100%;
      height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

  <div id="status">⚡ 북맵 오버레이 좌표 동기화 엔진 가동 중...</div>

  <div class="timeframe-bar">
    <button class="tf-btn active" onclick="changeTimeframe('1m', event)">1분</button>
    <button class="tf-btn" onclick="changeTimeframe('5m', event)">5분</button>
    <button class="tf-btn" onclick="changeTimeframe('15m', event)">15분</button>
    <button class="tf-btn" onclick="changeTimeframe('1h', event)">1시간</button>
  </div>

  <div class="chart-container">
    <div id="tv-chart"></div>
  </div>

  <div class="legend">
    <span>🟥 매도 매물대 띠 (Asks)</span>
    <span>🕯️ 캔들스틱 + 체결 버블</span>
    <span>🟩 매수 매물대 띠 (Bids)</span>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const container = document.querySelector('.chart-container');

    const chart = LightweightCharts.createChart(document.getElementById('tv-chart'), {
      layout: { backgroundColor: '#05070a', textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#161a25' }, horzLines: { color: '#161a25' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      priceScale: { borderColor: '#2a2e39' },
      timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981', downColor: '#f23645',
      borderUpColor: '#089981', borderDownColor: '#f23645',
      wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    function resizeChart() {
      chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
    }
    resizeChart();
    window.addEventListener('resize', resizeChart);

    let currentTF = '1m';
    let latestDepth = { bids: [], asks: [] };
    let tradeList = [];
    let currentPrice = 0;

    async function loadKlines(tf) {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=150`);
        const data = await res.json();
        const formatted = data.map(d => ({
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));
        candleSeries.setData(formatted);
      } catch (e) {
        console.error(e);
      }
    }
    loadKlines(currentTF);

    function changeTimeframe(tf, e) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      loadKlines(tf);
    }

    // 바이낸스 선물 웹소켓 연결
    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ 북맵 히트맵 실시간 연동 완료";
      statusEl.style.color = "#089981";
    };

    wsDepth.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.b || !data.a) return;

        latestDepth = {
          bids: data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]),
          asks: data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])])
        };
        currentPrice = (latestDepth.bids[0][0] + latestDepth.asks[0][0]) / 2;
      } catch (err) {
        console.error(err);
      }
    };

    wsTrade.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);
        const time = Math.floor(Date.now() / 1000);

        tradeList.push({
          price: price,
          qty: parseFloat(data.q),
          isMaker: data.m,
          time: time
        });
        if (tradeList.length > 50) tradeList.shift();

        candleSeries.update({
          time: time,
          close: price
        });
      } catch (err) {
        console.error(err);
      }
    };

    // 트레이딩뷰 차트의 커스텀 렌더링 플러그인(PaneView) 구현
    // 이 방식을 쓰면 차트 캔버스 내부에서 캔들과 북맵 띠가 완벽하게 한 좌표계로 동기화됨
    class BookmapOverlayRenderer {
      constructor(dataGetter, tradeGetter) {
        this._dataGetter = dataGetter;
        this._tradeGetter = tradeGetter;
      }

      draw(target) {
        target.useBitmapCoordinateSpace(scope => {
          const ctx = scope.context;
          const priceScale = candleSeries.priceScale();
          const timeScale = chart.timeScale();

          const depth = this._dataGetter();
          const trades = this._tradeGetter();

          if (!depth || depth.bids.length === 0) return;

          // 차트 우측 현재가 영역에 북맵 매물대 띠 수직 밴드 렌더링
          const visibleRange = timeScale.visibleLogicalRange();
          if (!visibleRange) return;

          const barSpacing = scope.mediaSize.width / (visibleRange.to - visibleRange.from);
          const targetX = scope.mediaSize.width - (barSpacing * 3); // 우측 캔들 부근

          ctx.save();

          // 1. 매도 매물대 (Asks)
          depth.asks.forEach(([p, q]) => {
            const yCoord = candleSeries.priceToCoordinate(p);
            if (yCoord !== null) {
              const mappedY = yCoord * scope.verticalPixelRatio;
              const alpha = Math.min(0.9, q / 2.0);
              ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
              ctx.fillRect((targetX - 30) * scope.horizontalPixelRatio, mappedY - 2, 60 * scope.horizontalPixelRatio, 4 * scope.verticalPixelRatio);
            }
          });

          // 2. 매수 매물대 (Bids)
          depth.bids.forEach(([p, q]) => {
            const yCoord = candleSeries.priceToCoordinate(p);
            if (yCoord !== null) {
              const mappedY = yCoord * scope.verticalPixelRatio;
              const alpha = Math.min(0.9, q / 2.0);
              ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
              ctx.fillRect((targetX - 30) * scope.horizontalPixelRatio, mappedY - 2, 60 * scope.horizontalPixelRatio, 4 * scope.verticalPixelRatio);
            }
          });

          // 3. 체결 버블
          trades.forEach(t => {
            const xCoord = timeScale.timeToCoordinate(t.time);
            const yCoord = candleSeries.priceToCoordinate(t.price);
            if (xCoord !== null && yCoord !== null) {
              const cx = xCoord * scope.horizontalPixelRatio;
              const cy = yCoord * scope.verticalPixelRatio;
              const r = Math.min(14, Math.max(3, Math.sqrt(t.qty) * 2.5)) * scope.horizontalPixelRatio;

              ctx.beginPath();
              ctx.arc(cx, cy, r, 0, Math.PI * 2);
              ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
              ctx.fill();
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 1;
              ctx.stroke();
            }
          });

          ctx.restore();
        });
      }
    }

    class BookmapOverlayPaneView {
      constructor(dataGetter, tradeGetter) {
        this._renderer = new BookmapOverlayRenderer(dataGetter, tradeGetter);
      }
      update() {}
      renderer() {
        return this._renderer;
      }
    }

    class BookmapOverlayPricePane {
      constructor(dataGetter, tradeGetter) {
        this._paneView = new BookmapOverlayPaneView(dataGetter, tradeGetter);
      }
      zorder() {
        return 'top';
      }
      paneViews() {
        return [this._paneView];
      }
    }

    // 차트에 플러그인 등록
    const overlayPlugin = new BookmapOverlayPaneView(() => latestDepth, () => tradeList);
    candleSeries.attachPrimitive({
      paneViews: () => [overlayPlugin]
    });

    // 렌더링 갱신 루프
    function updateLoop() {
      chart.timeScale().updateFormatter();
      requestAnimationFrame(updateLoop);
    }
    updateLoop();

  </script>
</body>
</html>
