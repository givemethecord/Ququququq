<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Order Book Map</title>
  <style>
    body { background-color: #131722; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 8px; font-weight: bold; background: #2a2e39; margin-bottom: 10px; border-radius: 4px; font-size: 13px; text-align: center; }
    .container { display: flex; flex-direction: column; gap: 10px; }
    .board { background: #1e222d; padding: 10px; border-radius: 4px; }
    .title { font-weight: bold; font-size: 13px; margin-bottom: 6px; }
    
    .row { 
      display: flex; 
      justify-content: space-between; 
      padding: 6px 8px; 
      font-family: monospace; 
      font-size: 14px; 
      position: relative; 
      z-index: 1;
      margin-bottom: 3px;
      border-radius: 2px;
    }
    
    /* 북맵 히트맵 배경 바 */
    .row::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; right: 0; left: 0;
      z-index: -1;
      border-radius: 2px;
      opacity: 0.35;
    }

    .ask .price { color: #f23645; font-weight: bold; }
    .ask::before { background-color: #f23645; }
    
    .bid .price { color: #089981; font-weight: bold; }
    .bid::before { background-color: #089981; }
  </style>
</head>
<body>

  <div id="status">연결 시도 중...</div>

  <div class="container">
    <div class="board">
      <div class="title" style="color:#f23645;">매도 호가 및 매물대 (Asks)</div>
      <div id="asks"></div>
    </div>
    <div class="board">
      <div class="title" style="color:#089981;">매수 호가 및 매물대 (Bids)</div>
      <div id="bids"></div>
    </div>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const asksEl = document.getElementById('asks');
    const bidsEl = document.getElementById('bids');

    const ws = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth10@100ms');

    ws.onopen = () => {
      statusEl.innerText = "⚡ 북맵 히트맵 연결 성공!";
      statusEl.style.color = "#089981";
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (!data.bids || !data.asks) return;

      const allItems = [...data.bids, ...data.asks];
      const maxQty = Math.max(...allItems.map(item => parseFloat(item[1])));

      // 매도 호가 (위쪽이 높은 가격)
      asksEl.innerHTML = data.asks.slice(0, 8).reverse().map(item => {
        const price = parseFloat(item[0]).toFixed(2);
        const qty = parseFloat(item[1]);
        const pct = Math.min(100, Math.max(10, (qty / maxQty) * 100));
        return `<div class="row ask">
                  <span class="price">${price}</span>
                  <span>${qty.toFixed(3)}</span>
                  <div style="position:absolute; top:0; bottom:0; right:0; width:${pct}%; background:rgba(242,54,69,0.3); z-index:-1; border-radius:2px;"></div>
                </div>`;
      }).join('');

      // 매수 호가
      bidsEl.innerHTML = data.bids.slice(0, 8).map(item => {
        const price = parseFloat(item[0]).toFixed(2);
        const qty = parseFloat(item[1]);
        const pct = Math.min(100, Math.max(10, (qty / maxQty) * 100));
        return `<div class="row bid">
                  <span class="price">${price}</span>
                  <span>${qty.toFixed(3)}</span>
                  <div style="position:absolute; top:0; bottom:0; right:0; width:${pct}%; background:rgba(8,153,129,0.3); z-index:-1; border-radius:2px;"></div>
                </div>`;
      }).join('');
    };

    ws.onerror = () => { statusEl.innerText = "❌ 연결 에러"; };
    ws.onclose = () => { statusEl.innerText = "⚠️ 연결 종료"; };
  </script>
</body>
</html>
