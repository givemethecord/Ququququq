<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Clean Chart + Orderbook Heatmap</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; overflow: hidden; }
    #status { padding: 8px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; color: #089981; }
    
    .timeframe-bar {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .tf-btn {
      background: #1e222d; border: 1px solid #2a2e39; color: #d1d4dc; padding: 4px 12px; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .tf-btn.active { background: #089981; border-color: #089981; color: #fff; font-weight: bold; }

    .canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 100px);
      background: #131722;
      border: 1px solid #2a2e39;
      border-radius: 4px;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
</head>
<body>

  <div id="status">⚡ 일반 차트 레이아웃 + 오더북 히트맵 오버레이 가동 중...</div>

  <div class="timeframe-bar">
    <button class="tf-btn active" onclick="changeTimeframe('1m', event)">1분</button>
    <button class="tf-btn" onclick="changeTimeframe('5m', event)">5분</button>
    <button class="tf-btn" onclick="changeTimeframe('15m', event)">15분</button>
    <button class="tf-btn" onclick="changeTimeframe('1h', event)">1시간</button>
  </div>

  <div class="canvas-container">
    <canvas id="chartCanvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 호가벽 (Asks Heatmap)</span>
    <span>🕯️ 클린 캔들스틱 + 체결 버블</span>
    <span>🟩 매수 호가벽 (Bids Heatmap)</span>
  </div>

  <script>
    const canvas = document.getElementById('chartCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentTF = '1m';
    let candles = [];
    let tradeList = [];
    let currentPrice = 0;
    let latestDepth = { bids: [], asks: [] };

    async function loadKlines(tf) {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=100`);
        const data = await res.json();
        candles = data.map(d => ({
          time: d[0],
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));
      } catch (e) {
        console.error(e);
      }
    }
    loadKlines(currentTF);

    function changeTimeframe(tf, e) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      loadKlines(tf);
    }

    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ 실시간 호가 및 차트 스트리밍 연결됨";
      statusEl.style.color = "#089981";
    };

    wsDepth.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.b || !data.a) return;

        latestDepth = {
          bids: data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]),
          asks: data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])])
        };
        currentPrice = (latestDepth.bids[0][0] + latestDepth.asks[0][0]) / 2;
        statusEl.innerText = `⚡ BTCUSDT 선물 실시간 가격: $${currentPrice.toFixed(2)}`;
      } catch (err) {
        console.error(err);
      }
    };

    wsTrade.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);
        const qty = parseFloat(data.q);
        const isMaker = data.m;
        const now = Date.now();

        tradeList.push({ price, qty, isMaker, time: now });
        if (tradeList.length > 80) tradeList.shift();

        if (candles.length > 0) {
          const lastCandle = candles[candles.length - 1];
          lastCandle.close = price;
          if (price > lastCandle.high) lastCandle.high = price;
          if (price < lastCandle.low) lastCandle.low = price;
        }
      } catch (err) {
        console.error(err);
      }
    };

    function render() {
      ctx.fillStyle = '#131722';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (candles.length > 0 && currentPrice > 0) {
        const rightSpace = 85;
        const chartWidth = canvas.width - rightSpace;
        const chartHeight = canvas.height;

        let minPrice = Infinity;
        let maxPrice = -Infinity;

        candles.forEach(c => {
          if (c.low < minPrice) minPrice = c.low;
          if (c.high > maxPrice) maxPrice = c.high;
        });

        // 일반 차트처럼 여유 마진 부여
        const span = Math.max(maxPrice - minPrice, 500);
        const center = (maxPrice + minPrice) / 2;
        minPrice = center - span / 1.2;
        maxPrice = center + span / 1.2;

        const getY = (p) => chartHeight - ((p - minPrice) / (maxPrice - minPrice)) * chartHeight;

        // 깔끔한 배경 그리드 (일반 거래소 스타일)
        ctx.strokeStyle = '#1f293d';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 6; i++) {
          const y = (chartHeight / 7) * i;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(chartWidth, y);
          ctx.stroke();
        }

        // [LAYER 1] 백그라운드 오더북 히트맵 오버레이 (현재 호가 잔량을 차트 배경에 은은하게 투영)
        if (latestDepth.asks) {
          latestDepth.asks.forEach(([p, q]) => {
            const y = getY(p);
            if (y >= 0 && y <= chartHeight) {
              const alpha = Math.min(0.4, q / 5.0); // 투명도를 낮춰 차트를 가리지 않게 조절
              ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
              ctx.fillRect(0, y - 2, chartWidth, 4);
            }
          });
        }

        if (latestDepth.bids) {
          latestDepth.bids.forEach(([p, q]) => {
            const y = getY(p);
            if (y >= 0 && y <= chartHeight) {
              const alpha = Math.min(0.4, q / 5.0);
              ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
              ctx.fillRect(0, y - 2, chartWidth, 4);
            }
          });
        }

        // [LAYER 2] 메인 캔들스틱 렌더링 (가장 선명하게 위로 오버레이)
        const candleWidth = Math.max(3, chartWidth / candles.length - 3);
        candles.forEach((c, index) => {
          const cx = (index / candles.length) * chartWidth + candleWidth / 2;
          const isUp = c.close >= c.open;
          const color = isUp ? '#089981' : '#f23645';

          // 심지
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(cx, getY(c.high));
          ctx.lineTo(cx, getY(c.low));
          ctx.stroke();

          // 몸통
          const bodyY = getY(Math.max(c.open, c.close));
          const bodyH = Math.max(1.5, Math.abs(getY(c.open) - getY(c.close)));
          ctx.fillStyle = color;
          ctx.fillRect(cx - candleWidth / 2, bodyY, candleWidth, bodyH);
        });

        // [LAYER 3] 실시간 체결 버블
        const now = Date.now();
        tradeList.forEach(t => {
          if (now - t.time < 4000) {
            const bx = chartWidth - 50;
            const by = getY(t.price);
            if (by >= 0 && by <= chartHeight) {
              const r = Math.min(12, Math.max(2, Math.sqrt(t.qty) * 2));
              ctx.beginPath();
              ctx.arc(bx, by, r, 0, Math.PI * 2);
              ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.8)' : 'rgba(8, 153, 129, 0.8)';
              ctx.fill();
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        });

        // [LAYER 4] 우측 가격 스케일 패널 & 현재가 라인
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(chartWidth, 0, rightSpace, chartHeight);

        const curY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, curY);
        ctx.lineTo(chartWidth, curY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(currentPrice.toFixed(1), chartWidth + 8, curY + 4);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
