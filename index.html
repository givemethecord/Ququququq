<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Pure Canvas Bookmap Engine</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; overflow: hidden; }
    #status { padding: 8px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; color: #089981; }
    
    .timeframe-bar {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .tf-btn {
      background: #1e222d; border: 1px solid #2a2e39; color: #d1d4dc; padding: 4px 12px; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .tf-btn.active { background: #089981; border-color: #089981; color: #fff; font-weight: bold; }

    .canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 100px);
      background: #05070a;
      border: 1px solid #2a2e39;
      border-radius: 4px;
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
</head>
<body>

  <div id="status">⚡ 순수 캔버스 북맵 엔진 스케일 조정 중...</div>

  <div class="timeframe-bar">
    <button class="tf-btn active" onclick="changeTimeframe('1m', event)">1분</button>
    <button class="tf-btn" onclick="changeTimeframe('5m', event)">5분</button>
    <button class="tf-btn" onclick="changeTimeframe('15m', event)">15분</button>
    <button class="tf-btn" onclick="changeTimeframe('1h', event)">1시간</button>
  </div>

  <div class="canvas-container">
    <canvas id="bookmapCanvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 띠 (Asks)</span>
    <span>🕯️ 캔들스틱 + 체결 버블</span>
    <span>🟩 매수 띠 (Bids)</span>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentTF = '1m';
    let candles = [];
    let orderbookRail = []; 
    let tradeList = [];
    let currentPrice = 0;
    const maxColumns = 200;

    async function loadKlines(tf) {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=120`);
        const data = await res.json();
        candles = data.map(d => ({
          time: d[0],
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));
      } catch (e) {
        console.error(e);
      }
    }
    loadKlines(currentTF);

    function changeTimeframe(tf, e) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      loadKlines(tf);
    }

    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    let latestDepth = { bids: [], asks: [] };

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ 북맵 히트맵 스케일 정상화 완료";
      statusEl.style.color = "#089981";
    };

    wsDepth.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.b || !data.a) return;

        latestDepth = {
          time: Date.now(),
          bids: data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]),
          asks: data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])])
        };
        currentPrice = (latestDepth.bids[0][0] + latestDepth.asks[0][0]) / 2;
        statusEl.innerText = `⚡ BTCUSDT 선물 실시간 가격: $${currentPrice.toFixed(2)}`;
      } catch (err) {
        console.error(err);
      }
    };

    wsTrade.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);
        const qty = parseFloat(data.q);
        const isMaker = data.m;
        const now = Date.now();

        tradeList.push({ price, qty, isMaker, time: now });
        if (tradeList.length > 100) tradeList.shift();

        if (candles.length > 0) {
          const lastCandle = candles[candles.length - 1];
          lastCandle.close = price;
          if (price > lastCandle.high) lastCandle.high = price;
          if (price < lastCandle.low) lastCandle.low = price;
        }
      } catch (err) {
        console.error(err);
      }
    };

    setInterval(() => {
      if (latestDepth.bids.length > 0) {
        orderbookRail.push(latestDepth);
        if (orderbookRail.length > maxColumns) {
          orderbookRail.shift();
        }
      }
    }, 150);

    function render() {
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentPrice > 0 && candles.length > 0) {
        const rightSpace = 85;
        const chartWidth = canvas.width - rightSpace;
        const chartHeight = canvas.height;

        // 핵심 수정: 현재 화면에 표시된 캔들들의 최고가/최저가를 기준으로 가격 스케일을 동적으로 잡되, 오더북 범위까지 완벽히 커버하도록 함
        let minPrice = Infinity;
        let maxPrice = -Infinity;

        candles.forEach(c => {
          if (c.low < minPrice) minPrice = c.low;
          if (c.high > maxPrice) maxPrice = c.high;
        });

        // 위아래로 여유 공간(Padding)을 널찍하게 줘서 매물대 띠가 화면 전체에 퍼지도록 함
        const padding = (maxPrice - minPrice) * 0.15 || 200;
        minPrice -= padding;
        maxPrice += padding;

        const getY = (p) => chartHeight - ((p - minPrice) / (maxPrice - minPrice)) * chartHeight;

        // 그리드 선
        ctx.strokeStyle = '#161a25';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 5; i++) {
          const y = (chartHeight / 6) * i;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(chartWidth, y);
          ctx.stroke();
        }

        // [LAYER 1] 북맵 수평 히트맵 띠 (확장된 가격 스케일에 맞춰 렌더링)
        while (orderbookRail.length < maxColumns) {
          orderbookRail.unshift(latestDepth);
        }
        const colWidth = chartWidth / maxColumns;

        for (let i = 0; i < orderbookRail.length; i++) {
          const snap = orderbookRail[i];
          const x = i * colWidth;

          if (snap.asks) {
            snap.asks.forEach(([p, q]) => {
              const y = getY(p);
              if (y >= 0 && y <= chartHeight) {
                const alpha = Math.min(0.9, q / 1.5);
                ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
                ctx.fillRect(x, y - 1, colWidth + 0.8, 3);
              }
            });
          }

          if (snap.bids) {
            snap.bids.forEach(([p, q]) => {
              const y = getY(p);
              if (y >= 0 && y <= chartHeight) {
                const alpha = Math.min(0.9, q / 1.5);
                ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
                ctx.fillRect(x, y - 1, colWidth + 0.8, 3);
              }
            });
          }
        }

        // [LAYER 2] 캔들스틱 렌더링
        const candleWidth = Math.max(2, chartWidth / candles.length - 3);
        candles.forEach((c, index) => {
          const cx = (index / candles.length) * chartWidth;
          const isUp = c.close >= c.open;
          const color = isUp ? '#089981' : '#f23645';

          ctx.strokeStyle = color;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(cx + candleWidth / 2, getY(c.high));
          ctx.lineTo(cx + candleWidth / 2, getY(c.low));
          ctx.stroke();

          const bodyY = getY(Math.max(c.open, c.close));
          const bodyH = Math.max(1, Math.abs(getY(c.open) - getY(c.close)));
          ctx.fillStyle = color;
          ctx.fillRect(cx, bodyY, candleWidth, bodyH);
        });

        // [LAYER 3] 체결 버블
        const now = Date.now();
        tradeList.forEach(t => {
          const age = now - t.time;
          if (age < 8000) {
            const bx = chartWidth - 45;
            const by = getY(t.price);
            if (by >= 0 && by <= chartHeight) {
              const r = Math.min(14, Math.max(2, Math.sqrt(t.qty) * 2.2));
              ctx.beginPath();
              ctx.arc(bx, by, r, 0, Math.PI * 2);
              ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
              ctx.fill();
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 0.5;
              ctx.stroke();
            }
          }
        });

        // [LAYER 4] 우측 가격 스케일 패널 & 현재가 수평선
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(chartWidth, 0, rightSpace, chartHeight);

        const curY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, curY);
        ctx.lineTo(chartWidth, curY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(currentPrice.toFixed(1), chartWidth + 8, curY + 4);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
