<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Bookmap Heatmap</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 8px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; color: #089981; }
    
    .bookmap-container {
      position: relative;
      width: 100%;
      height: 500px;
      background: #05070a;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      overflow: hidden;
    }
    
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
</head>
<body>

  <div id="status">⚡ 실시간 스크롤 북맵 엔진 가동 중...</div>

  <div class="bookmap-container">
    <canvas id="bookmapCanvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 띠 (Asks)</span>
    <span>🟢/🔴 체결 버블 (Trades)</span>
    <span>🟩 매수 띠 (Bids)</span>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth || window.innerWidth - 20;
      canvas.height = canvas.parentElement.clientHeight || 500;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentPrice = 0;
    let historyData = [];
    let tradeList = [];
    const maxColumns = 220; // 화면에 보여질 타임라인 폭

    // 바이낸스 선물 웹소켓
    const ws = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsT = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    let latestDepth = { bids: [], asks: [] };

    ws.onopen = () => {
      statusEl.innerText = "⚡ 북맵 히트맵 스트리밍 연결됨";
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.b || !data.a) return;

        latestDepth = {
          bids: data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]),
          asks: data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])])
        };
        
        currentPrice = (latestDepth.bids[0][0] + latestDepth.asks[0][0]) / 2;
        statusEl.innerText = `⚡ BTCUSDT 선물 실시간 가격: $${currentPrice.toFixed(2)}`;
      } catch (err) {
        console.error(err);
      }
    };

    wsT.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        tradeList.push({
          price: parseFloat(data.p),
          qty: parseFloat(data.q),
          isMaker: data.m,
          xPos: 1.0 // 오른쪽 끝에서 시작
        });
        if (tradeList.length > 80) tradeList.shift();
      } catch (err) {
        console.error(err);
      }
    };

    // 일정 주기로 오더북 스냅샷을 밀어넣어 북맵이 오른쪽에서 왼쪽으로 자연스럽게 흐르게 함
    setInterval(() => {
      if (latestDepth.bids.length > 0) {
        historyData.push(latestDepth);
        if (historyData.length > maxColumns) {
          historyData.shift();
        }
      }
    }, 150);

    function render() {
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentPrice > 0) {
        // 배열이 비어있으면 초기 데이터로 채움
        while (historyData.length < maxColumns) {
          historyData.push(latestDepth.bids.length > 0 ? latestDepth : { bids: [], asks: [] });
        }

        const range = 50; // 상하 $50 가격 폭
        const minP = currentPrice - range / 2;
        const maxP = currentPrice + range / 2;

        const getY = (p) => canvas.height - ((p - minP) / (maxP - minP)) * canvas.height;
        const rightSpace = 70;
        const chartW = canvas.width - rightSpace;
        const colW = chartW / maxColumns;

        // 1. [북맵 히트맵 띠] 좌우로 꽉 차서 흘러가는 레일 렌더링
        for (let i = 0; i < historyData.length; i++) {
          const snap = historyData[i];
          const x = i * colW;

          if (snap.asks) {
            snap.asks.forEach(([p, q]) => {
              const y = getY(p);
              if (y >= 0 && y <= canvas.height) {
                const alpha = Math.min(0.9, q / 1.8);
                ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
                ctx.fillRect(x, y - 1, colW + 0.8, 3);
              }
            });
          }

          if (snap.bids) {
            snap.bids.forEach(([p, q]) => {
              const y = getY(p);
              if (y >= 0 && y <= canvas.height) {
                const alpha = Math.min(0.9, q / 1.8);
                ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
                ctx.fillRect(x, y - 1, colW + 0.8, 3);
              }
            });
          }
        }

        // 2. 현재가 기준 수평선
        const curY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, curY);
        ctx.lineTo(chartW, curY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. 시장가 체결 버블 (우측 부근에 실시간 표시)
        const bubbleX = chartW - 40;
        tradeList.forEach(t => {
          const y = getY(t.price);
          if (y >= 0 && y <= canvas.height) {
            const r = Math.min(14, Math.max(2, Math.sqrt(t.qty) * 2.5));
            ctx.beginPath();
            ctx.arc(bubbleX, y, r, 0, Math.PI * 2);
            ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        });

        // 4. 우측 가격 스케일 바
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(chartW, 0, rightSpace, canvas.height);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(currentPrice.toFixed(1), chartW + 6, curY + 4);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
