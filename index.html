<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Real Heatmap Overlay</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 8px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; color: #089981; }
    
    .timeframe-bar {
      display: flex; gap: 6px; margin-bottom: 8px;
    }
    .tf-btn {
      background: #1e222d; border: 1px solid #2a2e39; color: #d1d4dc; padding: 4px 12px; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .tf-btn.active { background: #089981; border-color: #089981; color: #fff; font-weight: bold; }

    .chart-container {
      position: relative;
      width: 100%;
      height: 500px;
      background: #05070a;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      overflow: hidden;
    }
    
    #tv-chart {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    #heatmap-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

  <div id="status">⚡ 수평 히트맵 레일 엔진 가동 중...</div>

  <div class="timeframe-bar">
    <button class="tf-btn active" onclick="changeTimeframe('1m', event)">1분</button>
    <button class="tf-btn" onclick="changeTimeframe('5m', event)">5분</button>
    <button class="tf-btn" onclick="changeTimeframe('15m', event)">15분</button>
    <button class="tf-btn" onclick="changeTimeframe('1h', event)">1시간</button>
  </div>

  <div class="chart-container">
    <div id="tv-chart"></div>
    <canvas id="heatmap-canvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 띠 (Asks Heatmap)</span>
    <span>🕯️ 캔들스틱 + 체결 버블</span>
    <span>🟩 매수 띠 (Bids Heatmap)</span>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const container = document.querySelector('.chart-container');
    const canvas = document.getElementById('heatmap-canvas');
    const ctx = canvas.getContext('2d');

    const chart = LightweightCharts.createChart(document.getElementById('tv-chart'), {
      layout: { backgroundColor: 'transparent', textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#161a25' }, horzLines: { color: '#161a25' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      priceScale: { borderColor: '#2a2e39' },
      timeScale: { borderColor: '#2a2e39', timeVisible: true, secondsVisible: false }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#089981', downColor: '#f23645',
      borderUpColor: '#089981', borderDownColor: '#f23645',
      wickUpColor: '#089981', wickDownColor: '#f23645'
    });

    function resizeCanvas() {
      canvas.width = container.clientWidth;
      canvas.height = container.clientHeight;
      chart.applyOptions({ width: container.clientWidth, height: container.clientHeight });
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentTF = '1m';
    let historyRail = []; // 북맵처럼 가로로 흘러가는 오더북 스냅샷 큐
    let tradeList = [];
    let currentPrice = 0;
    const maxColumns = 180; // 화면에 유지할 가로 띠 칸 수

    async function loadKlines(tf) {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=150`);
        const data = await res.json();
        const formatted = data.map(d => ({
          time: Math.floor(d[0] / 1000),
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));
        candleSeries.setData(formatted);
      } catch (e) {
        console.error(e);
      }
    }
    loadKlines(currentTF);

    function changeTimeframe(tf, e) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      loadKlines(tf);
    }

    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    let latestDepth = { bids: [], asks: [] };

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ 오리지널 수평 히트맵 띠 연동 완료";
      statusEl.style.color = "#089981";
    };

    wsDepth.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.b || !data.a) return;

        latestDepth = {
          time: Math.floor(Date.now() / 1000),
          bids: data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]),
          asks: data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])])
        };
        currentPrice = (latestDepth.bids[0][0] + latestDepth.asks[0][0]) / 2;
      } catch (err) {
        console.error(err);
      }
    };

    wsTrade.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);
        const time = Math.floor(Date.now() / 1000);

        tradeList.push({
          price: price,
          qty: parseFloat(data.q),
          isMaker: data.m,
          time: time
        });
        if (tradeList.length > 60) tradeList.shift();

        candleSeries.update({
          time: time,
          close: price
        });
      } catch (err) {
        console.error(err);
      }
    };

    // 0.2초마다 오더북 스냅샷을 우측 레일에 밀어 넣어 수평 띠가 가로로 길게 쌓이도록 함
    setInterval(() => {
      if (latestDepth.bids.length > 0) {
        historyRail.push(latestDepth);
        if (historyRail.length > maxColumns) {
          historyRail.shift();
        }
      }
    }, 200);

    function renderOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const timeScale = chart.timeScale();

      if (historyRail.length > 0 && currentPrice > 0) {
        // [북맵 히트맵 수평 띠] 각 스냅샷의 시간을 차트 X축 좌표로 변환하여 수평 레일 렌더링
        for (let i = 0; i < historyRail.length; i++) {
          const snap = historyRail[i];
          const xCoord = timeScale.timeToCoordinate(snap.time);

          if (xCoord !== null && xCoord >= -20 && xCoord <= canvas.width) {
            // 매도 매물대 띠 (빨간색 계열 수평선)
            snap.asks.forEach(([p, q]) => {
              const yCoord = candleSeries.priceToCoordinate(p);
              if (yCoord !== null) {
                const alpha = Math.min(0.85, q / 2.0);
                ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
                ctx.fillRect(xCoord - 3, yCoord - 1, 6, 3);
              }
            });

            // 매수 매물대 띠 (초록색 계열 수평선)
            snap.bids.forEach(([p, q]) => {
              const yCoord = candleSeries.priceToCoordinate(p);
              if (yCoord !== null) {
                const alpha = Math.min(0.85, q / 2.0);
                ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
                ctx.fillRect(xCoord - 3, yCoord - 1, 6, 3);
              }
            });
          }
        }

        // [시장가 체결 버블]
        tradeList.forEach(t => {
          const xCoord = timeScale.timeToCoordinate(t.time);
          const yCoord = candleSeries.priceToCoordinate(t.price);

          if (xCoord !== null && yCoord !== null && xCoord >= 0 && xCoord <= canvas.width) {
            const r = Math.min(12, Math.max(2, Math.sqrt(t.qty) * 2.2));
            ctx.beginPath();
            ctx.arc(xCoord, yCoord, r, 0, Math.PI * 2);
            ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
            ctx.fill();
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 0.5;
            ctx.stroke();
          }
        });
      }

      requestAnimationFrame(renderOverlay);
    }

    renderOverlay();
  </script>
</body>
</html>
