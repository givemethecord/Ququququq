<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Bookmap Heatmap</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 8px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; color: #089981; }
    
    .bookmap-container {
      position: relative;
      width: 100%;
      height: 480px;
      background: #05070a;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      overflow: hidden;
    }
    
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
</head>
<body>

  <div id="status">⚡ 바이낸스 북맵 연결 시도 중...</div>

  <div class="bookmap-container">
    <canvas id="bookmapCanvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 띠 (Asks)</span>
    <span>🟢/🔴 체결 버블 (Trades)</span>
    <span>🟩 매수 띠 (Bids)</span>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth || window.innerWidth - 20;
      canvas.height = canvas.parentElement.clientHeight || 480;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentPrice = 0;
    let historyData = [];
    let tradeList = [];
    const maxColumns = 200;

    // 안전한 웹소켓 연결 (바이낸스 공식 스트림)
    const ws = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@depth20@100ms');
    const wsT = new WebSocket('wss://stream.binance.com:9443/ws/btcusdt@aggTrade');

    ws.onopen = () => {
      statusEl.innerText = "⚡ 바이낸스 오더북 수신 중...";
    };

    ws.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.bids || !data.asks) return;

        const bids = data.bids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
        const asks = data.asks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);
        
        currentPrice = (bids[0][0] + asks[0][0]) / 2;

        historyData.push({ bids, asks });
        if (historyData.length > maxColumns) {
          historyData.shift();
        }

        statusEl.innerText = `⚡ BTC 실시간 가격: $${currentPrice.toFixed(2)}`;
      } catch (err) {
        console.error(err);
      }
    };

    wsT.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        tradeList.push({
          price: parseFloat(data.p),
          qty: parseFloat(data.q),
          isMaker: data.m
        });
        if (tradeList.length > 50) tradeList.shift();
      } catch (err) {
        console.error(err);
      }
    };

    ws.onerror = () => { statusEl.innerText = "❌ 웹소켓 연결 에러 발생"; };
    ws.onclose = () => { statusEl.innerText = "⚠️ 웹소켓 연결 종료됨"; };

    function render() {
      // 캔버스 배경 클리어
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentPrice > 0 && historyData.length > 0) {
        const range = 50; // 상하 $50 폭
        const minP = currentPrice - range / 2;
        const maxP = currentPrice + range / 2;

        const getY = (p) => canvas.height - ((p - minP) / (maxP - minP)) * canvas.height;
        const rightSpace = 60;
        const chartW = canvas.width - rightSpace;
        const colW = chartW / maxColumns;

        // 1. 히트맵 띠 렌더링
        for (let i = 0; i < historyData.length; i++) {
          const snap = historyData[i];
          const x = i * colW;

          if (snap.asks) {
            snap.asks.forEach(([p, q]) => {
              const y = getY(p);
              const alpha = Math.min(0.85, q / 1.5);
              ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
              ctx.fillRect(x, y - 1, colW + 0.5, 3);
            });
          }

          if (snap.bids) {
            snap.bids.forEach(([p, q]) => {
              const y = getY(p);
              const alpha = Math.min(0.85, q / 1.5);
              ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
              ctx.fillRect(x, y - 1, colW + 0.5, 3);
            });
          }
        }

        // 2. 현재가 기준선
        const curY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, curY);
        ctx.lineTo(chartW, curY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. 체결 버블 렌더링
        const bubbleX = chartW - 25;
        tradeList.forEach(t => {
          const y = getY(t.price);
          const r = Math.min(12, Math.max(2, Math.sqrt(t.qty) * 2.5));
          ctx.beginPath();
          ctx.arc(bubbleX, y, r, 0, Math.PI * 2);
          ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
          ctx.fill();
        });

        // 4. 우측 가격 스케일 박스
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(chartW, 0, rightSpace, canvas.height);
        
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(currentPrice.toFixed(1), chartW + 6, curY + 4);
      }

      requestAnimationFrame(render);
    }

    render();
  </script>
</body>
</html>
