<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Real Bookmap Chart</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 6px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; }
    
    .bookmap-container {
      position: relative;
      width: 100%;
      height: 420px;
      background: #000;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      overflow: hidden;
    }
    
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 4px; color: #848e9c;
    }
  </style>
</head>
<body>

  <div id="status">⚡ 데이터 수신 대기 중...</div>

  <div class="bookmap-container">
    <canvas id="bookmapCanvas"></canvas>
  </div>
  <div class="legend">
    <span>🟥 매도 띠 (Asks)</span>
    <span>🟢/🔴 체결 (Trades)</span>
    <span>🟩 매수 띠 (Bids)</span>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentPrice = 0;
    let orderBook = { bids: [], asks: [] };
    let trades = [];
    let history = []; 
    const maxHistory = 200;

    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ 바이낸스 뎁스 연결됨 (데이터 수신 중)";
      statusEl.style.color = "#089981";
    };

    wsDepth.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (!data.bids || !data.asks || data.bids.length === 0) return;

      orderBook.bids = data.bids.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
      orderBook.asks = data.asks.map(a => [parseFloat(a[0]), parseFloat(a[1])]);

      currentPrice = (orderBook.bids[0][0] + orderBook.asks[0][0]) / 2;

      history.push({
        price: currentPrice,
        bids: [...orderBook.bids],
        asks: [...orderBook.asks]
      });

      if (history.length > maxHistory) history.shift();
      statusEl.innerText = `⚡ BTC 실시간 가격: ${currentPrice.toFixed(2)} USD`;
      statusEl.style.color = "#089981";
    };

    wsTrade.onmessage = (e) => {
      const data = JSON.parse(e.data);
      trades.push({
        price: parseFloat(data.p),
        qty: parseFloat(data.q),
        isMaker: data.m,
        x: canvas.width - 60,
        time: Date.now()
      });
      if (trades.length > 40) trades.shift();
    };

    function draw() {
      ctx.fillStyle = '#0b0e14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentPrice > 0 && history.length > 0) {
        // 상하 폭을 현재 가격 기준으로 자동 설정 ($100 밴드)
        const range = 100; 
        const minP = currentPrice - range / 2;
        const maxP = currentPrice + range / 2;

        const getY = (p) => canvas.height - ((p - minP) / (maxP - minP)) * canvas.height;
        const colWidth = (canvas.width - 60) / maxHistory;

        // 1. 히트맵 띠 그리기
        for (let i = 0; i < history.length; i++) {
          const snap = history[i];
          const x = i * colWidth;

          snap.asks.forEach(([p, q]) => {
            const y = getY(p);
            const alpha = Math.min(0.9, q / 3);
            ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
            ctx.fillRect(x, y, colWidth + 1, 4);
          });

          snap.bids.forEach(([p, q]) => {
            const y = getY(p);
            const alpha = Math.min(0.9, q / 3);
            ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
            ctx.fillRect(x, y, colWidth + 1, 4);
          });
        }

        // 2. 현재가 기준선
        const currentY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, currentY);
        ctx.lineTo(canvas.width - 60, currentY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 3. 체결 버블
        trades.forEach(t => {
          const y = getY(t.price);
          const radius = Math.min(12, Math.max(2, Math.sqrt(t.qty) * 3));
          ctx.beginPath();
          ctx.arc(t.x, y, radius, 0, Math.PI * 2);
          ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.8)' : 'rgba(8, 153, 129, 0.8)';
          ctx.fill();
        });

        // 4. 우측 가격 라벨 배경 및 텍스트
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(canvas.width - 60, 0, 60, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(currentPrice.toFixed(1), canvas.width - 58, currentY + 4);
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
