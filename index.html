<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Chart & Bookmap Full</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 8px; }
    #status { padding: 6px; font-weight: bold; background: #1e222d; margin-bottom: 6px; border-radius: 4px; font-size: 12px; text-align: center; }
    
    /* 1. 시간봉 조절 가능한 트레이딩뷰 차트 영역 */
    .chart-container {
      width: 100%;
      height: 320px;
      margin-bottom: 8px;
      border-radius: 4px;
      overflow: hidden;
      background: #1e222d;
    }

    /* 2. 북맵 히트맵 영역 */
    .bookmap-container {
      position: relative;
      width: 100%;
      height: 280px;
      background: #000;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      overflow: hidden;
    }
    
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <div id="status">⚡ 차트 & 북맵 엔진 초기화 중...</div>

  <!-- 상단: 캔들 차트 (시간봉 변경 툴바 포함) -->
  <div class="chart-container" id="tv_chart"></div>

  <!-- 하단: 북맵 히트맵 (매물대 띠 + 체결 버블) -->
  <div class="bookmap-container">
    <canvas id="bookmapCanvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 매물대 띠</span>
    <span>🟢/🔴 시장가 체결 (Trade)</span>
    <span>🟩 매수 매물대 띠</span>
  </div>

  <script>
    // 1. 트레이딩뷰 위젯 (시간봉 변경 툴바 활성화)
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "1",
      "timezone": "Asia/Seoul",
      "theme": "dark",
      "style": "1",
      "locale": "kr",
      "enable_publishing": false,
      "hide_top_toolbar": false, // 시간봉 선택 툴바 켬
      "allow_symbol_change": true,
      "container_id": "tv_chart"
    });

    // 2. 북맵 캔버스 엔진
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentPrice = 0;
    let history = [];
    let trades = [];
    const maxHistory = 150;

    const ws = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth10@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    ws.onopen = () => {
      statusEl.innerText = "⚡ 차트 & 북맵 풀세트 동기화 완료";
      statusEl.style.color = "#089981";
    };

    ws.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (!data.b || !data.a) return;

      const bids = data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
      const asks = data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])]);
      currentPrice = (bids[0][0] + asks[0][0]) / 2;

      history.push({ price: currentPrice, bids, asks });
      if (history.length > maxHistory) history.shift();
    };

    wsTrade.onmessage = (e) => {
      const data = JSON.parse(e.data);
      trades.push({
        price: parseFloat(data.p),
        qty: parseFloat(data.q),
        isMaker: data.m,
        x: canvas.width - 55
      });
      if (trades.length > 30) trades.shift();
    };

    function draw() {
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentPrice > 0 && history.length > 0) {
        const range = 80;
        const minP = currentPrice - range / 2;
        const maxP = currentPrice + range / 2;

        const getY = (p) => canvas.height - ((p - minP) / (maxP - minP)) * canvas.height;
        const colWidth = (canvas.width - 55) / maxHistory;

        // 배경 매물대 띠
        for (let i = 0; i < history.length; i++) {
          const snap = history[i];
          const x = i * colWidth;

          snap.asks.forEach(([p, q]) => {
            const y = getY(p);
            ctx.fillStyle = `rgba(242, 54, 69, ${Math.min(0.85, q / 2)})`;
            ctx.fillRect(x, y, colWidth + 1, 5);
          });

          snap.bids.forEach(([p, q]) => {
            const y = getY(p);
            ctx.fillStyle = `rgba(8, 153, 129, ${Math.min(0.85, q / 2)})`;
            ctx.fillRect(x, y, colWidth + 1, 5);
          });
        }

        // 현재가 선
        const currentY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, currentY);
        ctx.lineTo(canvas.width - 55, currentY);
        ctx.stroke();
        ctx.setLineDash([]);

        // 시장가 체결 버블
        trades.forEach(t => {
          const y = getY(t.price);
          const r = Math.min(12, Math.max(2, Math.sqrt(t.qty) * 3));
          ctx.beginPath();
          ctx.arc(t.x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
          ctx.fill();
        });

        // 우측 가격 표시
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(canvas.width - 55, 0, 55, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 10px monospace';
        ctx.fillText(currentPrice.toFixed(1), canvas.width - 52, currentY + 3);
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
