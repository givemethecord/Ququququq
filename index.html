<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pro-Grade Web Bookmap Engine</title>
  <style>
    body { background-color: #080a0f; color: #d1d4dc; font-family: monospace; margin: 0; padding: 0; overflow: hidden; }
    #toolbar { display: flex; justify-content: space-between; align-items: center; padding: 6px 12px; background: #121622; border-bottom: 1px solid #1e2638; font-size: 12px; }
    #metrics { color: #00ffcc; font-weight: bold; }
    .canvas-container { position: relative; width: 100vw; height: calc(100vh - 35px); }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>

  <div id="toolbar">
    <div>⚡ BTCUSDT L2/L3 Simulation Engine <span id="metrics">[FPS: 60 | Queue: 0]</span></div>
    <div>Time-Price Grid Heatmap Active</div>
  </div>

  <div class="canvas-container">
    <canvas id="bookmapCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d', { alpha: false }); // 알파 채널 제거로 렌더링 성능 극대화
    const metricsEl = document.getElementById('metrics');

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight - 35;
    }
    window.addEventListener('resize', resize);
    resize();

    // 엔진 데이터 구조
    const maxColumns = 300; // 시간축 레일 폭
    let orderbookRail = [];  // 오더북 히트맵 링 버퍼
    let candles = [];        // 캔들 데이터
    let trades = [];         // 체결 틱 버블 데이터
    let currentPrice = 0;
    let minPrice = Infinity, maxPrice = -Infinity;

    // 바이낸스 웹소켓 연결 (Depth & Trades)
    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    let latestDepth = { bids: [], asks: [] };

    wsDepth.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (!data.b || !data.a) return;
      latestDepth = {
        bids: data.b.map(x => [parseFloat(x[0]), parseFloat(x[1])]),
        asks: data.a.map(x => [parseFloat(x[0]), parseFloat(x[1])])
      };
      const topBid = latestDepth.bids[0][0];
      const topAsk = latestDepth.asks[0][0];
      currentPrice = (topBid + topAsk) / 2;
    };

    wsTrade.onmessage = (e) => {
      const data = JSON.parse(e.data);
      trades.push({
        price: parseFloat(data.p),
        qty: parseFloat(data.q),
        isMaker: data.m,
        time: Date.now()
      });
      if (trades.length > 200) trades.shift();
    };

    // 초기 캔들 로드
    async function initKlines() {
      const res = await fetch('https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1m&limit=100');
      const data = await res.json();
      candles = data.map(d => ({
        time: d[0], open: +d[1], high: +d[2], low: +d[3], close: +d[4]
      }));
    }
    initKlines();

    // 100ms 주기로 오더북 스냅샷을 타임스탬프 레일에 적재 (북맵 히트맵의 핵심 원리)
    setInterval(() => {
      if (latestDepth.bids.length > 0) {
        orderbookRail.push({
          time: Date.now(),
          bids: [...latestDepth.bids],
          asks: [...latestDepth.asks]
        });
        if (orderbookRail.length > maxColumns) orderbookRail.shift();
      }
    }, 100);

    // 고성능 렌더링 루프 (60 FPS Target)
    let lastTime = performance.now();
    let frameCount = 0;
    let fps = 60;

    function render(now) {
      frameCount++;
      if (now - lastTime >= 1000) {
        fps = frameCount;
        frameCount = 0;
        lastTime = now;
        metricsEl.innerText = `[FPS: ${fps} | Buffer: ${orderbookRail.length}]`;
      }

      // 1. 화면 클리어 (다크 테마)
      ctx.fillStyle = '#0b0e14';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (candles.length > 0 && currentPrice > 0) {
        const rightPadding = 80;
        const width = canvas.width - rightPadding;
        const height = canvas.height;

        // 가격 범위 계산
        minPrice = Infinity; maxPrice = -Infinity;
        candles.forEach(c => {
          if (c.low < minPrice) minPrice = c.low;
          if (c.high > maxPrice) maxPrice = c.high;
        });
        const span = Math.max(maxPrice - minPrice, 300);
        const center = (maxPrice + minPrice) / 2;
        minPrice = center - span / 1.1;
        maxPrice = center + span / 1.1;

        const getY = p => height - ((p - minPrice) / (maxPrice - minPrice)) * height;
        const colWidth = width / maxColumns;

        // [LAYER 1] 배경 오더북 히트맵 렌더링 (시간-가격 레일)
        for (let i = 0; i < orderbookRail.length; i++) {
          const snap = orderbookRail[i];
          const x = i * colWidth;

          // Asks (매도 호가벽 - 붉은 계열)
          snap.asks.forEach(([p, q]) => {
            const y = getY(p);
            if (y >= 0 && y <= height) {
              const alpha = Math.min(0.6, q / 4.0);
              ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
              ctx.fillRect(x, y - 1, colWidth + 0.5, 2.5);
            }
          });

          // Bids (매수 호가벽 - 초록 계열)
          snap.bids.forEach(([p, q]) => {
            const y = getY(p);
            if (y >= 0 && y <= height) {
              const alpha = Math.min(0.6, q / 4.0);
              ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
              ctx.fillRect(x, y - 1, colWidth + 0.5, 2.5);
            }
          });
        }

        // [LAYER 2] 캔들스틱 렌더링
        const candleW = Math.max(2, width / candles.length - 2);
        candles.forEach((c, idx) => {
          const cx = (idx / candles.length) * width + candleW / 2;
          const isUp = c.close >= c.open;
          ctx.strokeStyle = isUp ? '#089981' : '#f23645';
          ctx.lineWidth = 1;
          
          // 위/아래 심지
          ctx.beginPath();
          ctx.moveTo(cx, getY(c.high));
          ctx.lineTo(cx, getY(c.low));
          ctx.stroke();

          // 몸통
          const by = getY(Math.max(c.open, c.close));
          const bh = Math.max(1, Math.abs(getY(c.open) - getY(c.close)));
          ctx.fillStyle = isUp ? '#089981' : '#f23645';
          ctx.fillRect(cx - candleW / 2, by, candleW, bh);
        });

        // [LAYER 3] 실시간 체결 버블 렌더링
        const currentTime = Date.now();
        trades.forEach(t => {
          const age = currentTime - t.time;
          if (age < 4000) { // 4초 동안 잔상 유지 후 소멸
            const bx = width - 40;
            const by = getY(t.price);
            if (by >= 0 && by <= height) {
              const radius = Math.min(12, Math.max(2, Math.sqrt(t.qty) * 2));
              ctx.beginPath();
              ctx.arc(bx, by, radius, 0, Math.PI * 2);
              ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.7)' : 'rgba(8, 153, 129, 0.7)';
              ctx.fill();
            }
          }
        });

        // [LAYER 4] 우측 가격 패널 & 현재가 라인
        ctx.fillStyle = '#121622';
        ctx.fillRect(width, 0, rightPadding, height);

        const curY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.setLineDash([2, 2]);
        ctx.beginPath();
        ctx.moveTo(0, curY);
        ctx.lineTo(width, curY);
        ctx.stroke();
        ctx.setLineDash([]);

        ctx.fillStyle = '#2962ff';
        ctx.fillRect(width, curY - 9, rightPadding, 18);
        ctx.fillStyle = '#ffffff';
        ctx.font = '11px monospace';
        ctx.fillText(currentPrice.toFixed(1), width + 6, curY + 4);
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
