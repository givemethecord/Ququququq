<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Chart Overlay Bookmap</title>
  <style>
    body { background-color: #0d1117; color: #c9d1d9; font-family: sans-serif; margin: 0; padding: 8px; }
    #status { padding: 6px; font-weight: bold; background: #161b22; margin-bottom: 6px; border-radius: 4px; font-size: 12px; text-align: center; color: #58a6ff; }
    
    .timeframe-bar {
      display: flex; gap: 6px; margin-bottom: 6px;
    }
    .tf-btn {
      background: #21262d; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 10px; font-size: 12px; border-radius: 4px; cursor: pointer;
    }
    .tf-btn.active { background: #238636; border-color: #2ea043; color: #fff; font-weight: bold; }

    /* 차트 + 오버레이 캔버스 컨테이너 */
    #chart-wrapper {
      position: relative;
      width: 100%;
      height: 480px;
      border: 1px solid #30363d;
      border-radius: 6px;
      overflow: hidden;
      background: #0d1117;
    }

    #tv-chart {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0; left: 0;
      z-index: 1;
    }

    /* 캔들 바로 뒤에 위치하는 북맵 히트맵 캔버스 */
    #heatmap-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none; /* 클릭 이벤트 차트 통과 */
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #8b949e;
    }
  </style>
  <!-- Lightweight Charts 공식 라이브러리 -->
  <script src="https://unpkg.com/lightweight-charts@4.1.1/dist/lightweight-charts.standalone.production.js"></script>
</head>
<body>

  <div id="status">⚡ 바이낸스 차트 & 오버레이 북맵 엔진 연결 중...</div>

  <div class="timeframe-bar">
    <button class="tf-btn active" onclick="changeTimeframe('1m')">1분</button>
    <button class="tf-btn" onclick="changeTimeframe('5m')">5분</button>
    <button class="tf-btn" onclick="changeTimeframe('15m')">15분</button>
    <button class="tf-btn" onclick="changeTimeframe('1h')">1시간</button>
  </div>

  <div id="chart-wrapper">
    <div id="tv-chart"></div>
    <canvas id="heatmap-canvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 잔량 띠 (Asks)</span>
    <span>🕯️ 실시간 캔들스틱 + 🟢/🔴 체결</span>
    <span>🟩 매수 잔량 띠 (Bids)</span>
  </div>

  <script>
    const statusEl = document.getElementById('status');
    const wrapper = document.getElementById('chart-wrapper');
    const canvas = document.getElementById('heatmap-canvas');
    const ctx = canvas.getContext('2d');

    // 1. Lightweight Chart 생성
    const chart = LightweightCharts.createChart(document.getElementById('tv-chart'), {
      layout: { backgroundColor: '#0d1117', textColor: '#c9d1d9' },
      grid: { vertLines: { color: '#161b22' }, horzLines: { color: '#161b22' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      priceScale: { borderColor: '#30363d' },
      timeScale: { borderColor: '#30363d', timeVisible: true, secondsVisible: false }
    });

    const candleSeries = chart.addCandlestickSeries({
      upColor: '#2ea043', downColor: '#f85149',
      borderUpColor: '#2ea043', borderDownColor: '#f85149',
      wickUpColor: '#2ea043', wickDownColor: '#f85149'
    });

    function resizeCanvas() {
      canvas.width = wrapper.clientWidth;
      canvas.height = wrapper.clientHeight;
      chart.applyOptions({ width: wrapper.clientWidth, height: wrapper.clientHeight });
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentTF = '1m';
    let history = [];
    let trades = [];
    let currentPrice = 0;
    const maxHistory = 160;

    // 초기 캔들 데이터 불러오기 (바이낸스 REST API)
    async function loadKlines(tf) {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=100`);
        const data = await res.json();
        const formatted = data.map(d => ({
          time: d[0] / 1000,
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));
        candleSeries.setData(formatted);
      } catch (e) {
        console.error(e);
      }
    }
    loadKlines(currentTF);

    function changeTimeframe(tf) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      loadKlines(tf);
    }

    // 2. 바이낸스 웹소켓 (실시간 호가 뎁스 + 체결 데이터)
    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth10@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ 실시간 캔들 & 북맵 오버레이 작동 완료";
      statusEl.style.color = "#3fb950";
    };

    wsDepth.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (!data.b || !data.a) return;

      const bids = data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
      const asks = data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])]);
      currentPrice = (bids[0][0] + asks[0][0]) / 2;

      history.push({ price: currentPrice, bids, asks });
      if (history.length > maxHistory) history.shift();
    };

    wsTrade.onmessage = (e) => {
      const data = JSON.parse(e.data);
      const price = parseFloat(data.p);
      trades.push({
        price: price,
        qty: parseFloat(data.q),
        isMaker: data.m,
        time: Date.now()
      });
      if (trades.length > 40) trades.shift();

      // 현재 캔들 실시간 갱신
      candleSeries.update({
        time: Math.floor(Date.now() / 1000),
        close: price
      });
    };

    // 3. 차트 Y축 좌표계 기반 북맵 띠 렌더링 루프
    function drawOverlay() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (history.length > 0) {
        const colWidth = (canvas.width - 60) / maxHistory;

        for (let i = 0; i < history.length; i++) {
          const snap = history[i];
          const x = i * colWidth;

          // 차트의 가격(Price)을 캔버스 Y좌표로 변환
          snap.asks.forEach(([p, q]) => {
            const y = candleSeries.priceToCoordinate(p);
            if (y !== null) {
              ctx.fillStyle = `rgba(248, 81, 73, ${Math.min(0.65, q / 3)})`;
              ctx.fillRect(x, y - 2, colWidth + 1, 4);
            }
          });

          snap.bids.forEach(([p, q]) => {
            const y = candleSeries.priceToCoordinate(p);
            if (y !== null) {
              ctx.fillStyle = `rgba(46, 160, 67, ${Math.min(0.65, q / 3)})`;
              ctx.fillRect(x, y - 2, colWidth + 1, 4);
            }
          });
        }

        // 체결 버블 렌더링
        trades.forEach(t => {
          const y = candleSeries.priceToCoordinate(t.price);
          if (y !== null) {
            const r = Math.min(12, Math.max(2, Math.sqrt(t.qty) * 2.5));
            ctx.beginPath();
            ctx.arc(canvas.width - 70, y, r, 0, Math.PI * 2);
            ctx.fillStyle = t.isMaker ? 'rgba(248, 81, 73, 0.8)' : 'rgba(46, 160, 67, 0.8)';
            ctx.fill();
          }
        });
      }

      requestAnimationFrame(drawOverlay);
    }

    drawOverlay();
  </script>
</body>
</html>
