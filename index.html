<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Full Overlay Bookmap</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 6px; font-weight: bold; background: #1e222d; margin-bottom: 8px; border-radius: 4px; font-size: 12px; text-align: center; }
    
    .bookmap-container {
      position: relative;
      width: 100%;
      height: 500px;
      background: #05070a;
      border: 1px solid #2a2e39;
      border-radius: 4px;
      overflow: hidden;
    }
    
    canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
    }

    .legend {
      display: flex; justify-content: space-between; font-size: 11px; padding: 6px 4px; color: #848e9c;
    }
  </style>
</head>
<body>

  <div id="status">⚡ 캔들 + 북맵 매물대 오버레이 엔진 로딩 중...</div>

  <div class="bookmap-container">
    <canvas id="bookmapCanvas"></canvas>
  </div>

  <div class="legend">
    <span>🟥 매도 지정가 띠 (Asks)</span>
    <span>🕯️ 1분봉 캔들스틱 + 🟢/🔴 체결</span>
    <span>🟩 매수 지정가 띠 (Bids)</span>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentPrice = 0;
    let history = [];
    let trades = [];
    let klineData = []; // 1분봉 Data
    let currentCandle = null;
    const maxHistory = 180;

    // 1. 바이낸스 웹소켓 (뎁스, 체결, 1분 kline)
    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth10@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');
    const wsKline = new WebSocket('wss://fstream.binance.com/ws/btcusdt@kline_1m');

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ 캔들 탑재 북맵 히트맵 오버레이 작동 중";
      statusEl.style.color = "#089981";
    };

    wsDepth.onmessage = (e) => {
      const data = JSON.parse(e.data);
      if (!data.b || !data.a) return;

      const bids = data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]);
      const asks = data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])]);
      currentPrice = (bids[0][0] + asks[0][0]) / 2;

      history.push({ price: currentPrice, bids, asks });
      if (history.length > maxHistory) history.shift();
    };

    wsTrade.onmessage = (e) => {
      const data = JSON.parse(e.data);
      trades.push({
        price: parseFloat(data.p),
        qty: parseFloat(data.q),
        isMaker: data.m,
        x: canvas.width - 60
      });
      if (trades.length > 40) trades.shift();
    };

    wsKline.onmessage = (e) => {
      const data = JSON.parse(e.data);
      const k = data.k;
      currentCandle = {
        open: parseFloat(k.o),
        high: parseFloat(k.h),
        low: parseFloat(k.l),
        close: parseFloat(k.c)
      };
    };

    function draw() {
      ctx.fillStyle = '#05070a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (currentPrice > 0 && history.length > 0) {
        const range = 100; // 상하 $100 가격폭
        const minP = currentPrice - range / 2;
        const maxP = currentPrice + range / 2;

        const getY = (p) => canvas.height - ((p - minP) / (maxP - minP)) * canvas.height;
        const colWidth = (canvas.width - 60) / maxHistory;

        // LAYER 1: 배경 매물대 히트맵 띠 (캔들 바로 뒤에 깔림)
        for (let i = 0; i < history.length; i++) {
          const snap = history[i];
          const x = i * colWidth;

          snap.asks.forEach(([p, q]) => {
            const y = getY(p);
            ctx.fillStyle = `rgba(242, 54, 69, ${Math.min(0.75, q / 2.5)})`;
            ctx.fillRect(x, y, colWidth + 1, 4);
          });

          snap.bids.forEach(([p, q]) => {
            const y = getY(p);
            ctx.fillStyle = `rgba(8, 153, 129, ${Math.min(0.75, q / 2.5)})`;
            ctx.fillRect(x, y, colWidth + 1, 4);
          });
        }

        // LAYER 2: 1분봉 캔들스틱 (매물대 띠 위에 겹쳐서 오버레이)
        if (currentCandle) {
          const candleX = canvas.width - 90;
          const openY = getY(currentCandle.open);
          const closeY = getY(currentCandle.close);
          const highY = getY(currentCandle.high);
          const lowY = getY(currentCandle.low);
          const isUp = currentCandle.close >= currentCandle.open;
          const color = isUp ? '#089981' : '#f23645';

          // 윗꼬리 / 아랫꼬리
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.5;
          ctx.beginPath();
          ctx.moveTo(candleX, highY);
          ctx.lineTo(candleX, lowY);
          ctx.stroke();

          // 캔들 몸통
          ctx.fillStyle = color;
          const bodyY = Math.min(openY, closeY);
          const bodyH = Math.max(2, Math.abs(closeY - openY));
          ctx.fillRect(candleX - 6, bodyY, 12, bodyH);
        }

        // LAYER 3: 현재가 실시간 점선
        const currentY = getY(currentPrice);
        ctx.strokeStyle = '#2962ff';
        ctx.lineWidth = 1;
        ctx.setLineDash([3, 3]);
        ctx.beginPath();
        ctx.moveTo(0, currentY);
        ctx.lineTo(canvas.width - 60, currentY);
        ctx.stroke();
        ctx.setLineDash([]);

        // LAYER 4: 시장가 체결 버블
        trades.forEach(t => {
          const y = getY(t.price);
          const r = Math.min(14, Math.max(3, Math.sqrt(t.qty) * 3));
          ctx.beginPath();
          ctx.arc(t.x, y, r, 0, Math.PI * 2);
          ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
          ctx.fill();
          ctx.strokeStyle = '#fff';
          ctx.lineWidth = 0.5;
          ctx.stroke();
        });

        // LAYER 5: 우측 가격 라벨
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(canvas.width - 60, 0, 60, canvas.height);
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 11px monospace';
        ctx.fillText(currentPrice.toFixed(1), canvas.width - 56, currentY + 4);
      }

      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
