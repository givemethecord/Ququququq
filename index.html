<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Pro Custom Bookmap Engine</title>
  <style>
    body { background-color: #0b0e14; color: #d1d4dc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 10px; overflow: hidden; }
    #header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    #status { font-weight: bold; font-size: 13px; color: #089981; }
    
    .timeframe-bar {
      display: flex; gap: 6px;
    }
    .tf-btn {
      background: #1e222d; border: 1px solid #2a2e39; color: #d1d4dc; padding: 4px 12px; font-size: 12px; border-radius: 4px; cursor: pointer; transition: 0.2s;
    }
    .tf-btn:hover { background: #2a2e39; }
    .tf-btn.active { background: #089981; border-color: #089981; color: #fff; font-weight: bold; }

    .canvas-container {
      position: relative;
      width: 100vw;
      height: calc(100vh - 90px);
      background: #131722;
      border: 1px solid #2a2e39;
      border-radius: 6px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }
    
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    .legend {
      position: absolute; bottom: 10px; left: 10px; display: flex; gap: 15px; font-size: 11px; background: rgba(19, 23, 34, 0.85); padding: 6px 10px; border-radius: 4px; border: 1px solid #2a2e39; pointer-events: none;
    }
    .legend span { display: flex; align-items: center; gap: 4px; }
  </style>
</head>
<body>

  <div id="header">
    <div id="status">⚡ 실시간 바이낸스 데이터 스트리밍 연결 중...</div>
    <div class="timeframe-bar">
      <button class="tf-btn active" onclick="changeTimeframe('1m', event)">1분</button>
      <button class="tf-btn" onclick="changeTimeframe('5m', event)">5분</button>
      <button class="tf-btn" onclick="changeTimeframe('15m', event)">15분</button>
      <button class="tf-btn" onclick="changeTimeframe('1h', event)">1시간</button>
    </div>
  </div>

  <div class="canvas-container">
    <canvas id="bookmapCanvas"></canvas>
    <div class="legend">
      <span><span style="color:#f23645">■</span> 매도 호가벽 (Asks)</span>
      <span><span style="color:#089981">■</span> 매수 호가벽 (Bids)</span>
      <span>⚪ 체결 버블 (Trades)</span>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bookmapCanvas');
    const ctx = canvas.getContext('2d');
    const statusEl = document.getElementById('status');

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    let currentTF = '1m';
    let candles = [];
    let orderbookRail = []; 
    let tradeList = [];
    let currentPrice = 0;
    let latestDepth = { bids: [], asks: [] };
    const maxColumns = 220; // 시간축 레일 컬럼 수

    // 1. 바이낸스 캔들(Klines) 데이터 로드
    async function loadKlines(tf) {
      try {
        const res = await fetch(`https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=${tf}&limit=120`);
        const data = await res.json();
        candles = data.map(d => ({
          time: d[0],
          open: parseFloat(d[1]),
          high: parseFloat(d[2]),
          low: parseFloat(d[3]),
          close: parseFloat(d[4])
        }));
      } catch (e) {
        console.error("캔들 로딩 실패:", e);
      }
    }
    loadKlines(currentTF);

    function changeTimeframe(tf, e) {
      currentTF = tf;
      document.querySelectorAll('.tf-btn').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      loadKlines(tf);
    }

    // 2. 바이낸스 웹소켓 연결 (오더북 뎁스 + 체결 틱)
    const wsDepth = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth20@100ms');
    const wsTrade = new WebSocket('wss://fstream.binance.com/ws/btcusdt@aggTrade');

    wsDepth.onopen = () => {
      statusEl.innerText = "⚡ BTCUSDT 선물 엔진 정상 작동 중";
    };

    wsDepth.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        if (!data.b || !data.a) return;

        latestDepth = {
          time: Date.now(),
          bids: data.b.map(b => [parseFloat(b[0]), parseFloat(b[1])]),
          asks: data.a.map(a => [parseFloat(a[0]), parseFloat(a[1])])
        };
        currentPrice = (latestDepth.bids[0][0] + latestDepth.asks[0][0]) / 2;
      } catch (err) {
        console.error(err);
      }
    };

    wsTrade.onmessage = (event) => {
      try {
        const data = JSON.parse(event.data);
        const price = parseFloat(data.p);
        const qty = parseFloat(data.q);
        const isMaker = data.m; // true면 매도자 주도(매도), false면 매수자 주도(매수)
        const now = Date.now();

        tradeList.push({ price, qty, isMaker, time: now });
        if (tradeList.length > 120) tradeList.shift();

        // 마지막 캔들 실시간 갱신
        if (candles.length > 0) {
          const lastCandle = candles[candles.length - 1];
          lastCandle.close = price;
          if (price > lastCandle.high) lastCandle.high = price;
          if (price < lastCandle.low) lastCandle.low = price;
        }
      } catch (err) {
        console.error(err);
      }
    };

    // 0.1초마다 오더북 스냅샷을 히트맵 레일에 적재 (FIFO)
    setInterval(() => {
      if (latestDepth.bids.length > 0) {
        orderbookRail.push(JSON.parse(JSON.stringify(latestDepth)));
        if (orderbookRail.length > maxColumns) {
          orderbookRail.shift();
        }
      }
    }, 100);

    // 3. 메인 렌더링 루프 (Canvas 2D Pipeline)
    function render() {
      ctx.fillStyle = '#131722';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (candles.length > 0 && currentPrice > 0) {
        const rightSpace = 90; // 우측 가격 패널 폭
        const chartWidth = canvas.width - rightSpace;
        const chartHeight = canvas.height;

        // 가격 범위 산출
        let minPrice = Infinity;
        let maxPrice = -Infinity;

        candles.forEach(c => {
          if (c.low < minPrice) minPrice = c.low;
          if (c.high > maxPrice) maxPrice = c.high;
        });

        const span = Math.max(maxPrice - minPrice, 400);
        const center = (maxPrice + minPrice) / 2;
        minPrice = center - span / 1.15;
        maxPrice = center + span / 1.15;

        // 가격 -> Y좌표 변환 함수
        const getY = (p) => chartHeight - ((p - minPrice) / (maxPrice - minPrice)) * chartHeight;

        // 배경 그리드 라인
        ctx.strokeStyle = '#1f293d';
        ctx.lineWidth = 1;
        for (let i = 1; i <= 6; i++) {
          const y = (chartHeight / 7) * i;
          ctx.beginPath();
          ctx.moveTo(0, y);
          ctx.lineTo(chartWidth, y);
          ctx.stroke();
        }

        // [LAYER 1] 백그라운드 오더북 히트맵 띠 (시간 축을 따라 흐르는 레일)
        while (orderbookRail.length < maxColumns) {
          orderbookRail.unshift(latestDepth);
        }
        const colWidth = chartWidth / maxColumns;

        for (let i = 0; i < orderbookRail.length; i++) {
          const snap = orderbookRail[i];
          const x = i * colWidth;

          if (snap.asks) {
            snap.asks.forEach(([p, q]) => {
              const y = getY(p);
              if (y >= 0 && y <= chartHeight) {
                const alpha = Math.min(0.5, q / 3.5); // 물량 많을수록 진해짐
                ctx.fillStyle = `rgba(242, 54, 69, ${alpha})`;
                ctx.fillRect(x, y - 1, colWidth + 1, 3);
              }
            });
          }

          if (snap.bids) {
            snap.bids.forEach(([p, q]) => {
              const y = getY(p);
              if (y >= 0 && y <= chartHeight) {
                const alpha = Math.min(0.5, q / 3.5);
                ctx.fillStyle = `rgba(8, 153, 129, ${alpha})`;
                ctx.fillRect(x, y - 1, colWidth + 1, 3);
              }
            });
          }
        }

        // [LAYER 2] 메인 캔들스틱 렌더링
        const candleWidth = Math.max(3, chartWidth / candles.length - 2.5);
        candles.forEach((c, index) => {
          const cx = (index / candles.length) * chartWidth + candleWidth / 2;
          const isUp = c.close >= c.open;
          const color = isUp ? '#089981' : '#f23645';

          // 심지
          ctx.strokeStyle = color;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(cx, getY(c.high));
          ctx.lineTo(cx, getY(c.low));
          ctx.stroke();

          // 몸통
          const bodyY = getY(Math.max(c.open, c.close));
          const bodyH = Math.max(1.5, Math.abs(getY(c.open) - getY(c.close)));
          ctx.fillStyle = color;
          ctx.fillRect(cx - candleWidth / 2, bodyY, candleWidth, bodyH);
        });

        // [LAYER 3] 실시간 체결 버블 (거래량 비례 크기)
        const now = Date.now();
        tradeList.forEach(t => {
          if (now - t.time < 5000) {
            const bx = chartWidth - 60; // 우측 영역 근처에 배치
            const by = getY(t.price);
            if (by >= 0 && by <= chartHeight) {
              const r = Math.min(14, Math.max(2.5, Math.sqrt(t.qty) * 2.2));
              ctx.beginPath();
              ctx.arc(bx, by, r, 0, Math.PI * 2);
              ctx.fillStyle = t.isMaker ? 'rgba(242, 54, 69, 0.85)' : 'rgba(8, 153, 129, 0.85)';
              ctx.fill();
              ctx.strokeStyle = '#ffffff';
              ctx.lineWidth = 0.6;
              ctx.stroke();
            }
          }
        });

        // [LAYER 4] 우측 가격 패널 & 현재가 실시간 라인
        ctx.fillStyle = '#1e222d';
        ctx.fillRect(chartWidth, 0, rightSpace, chartHeight);

        // 패널 경계선
        ctx.strokeStyle = '#2a2e39';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(chartWidth, 0);
        ctx.lineTo(chartWidth, chartHeight);
        ctx.stroke();

        const curY = getY(currentPrice);
        if (curY >= 0 && curY <= chartHeight) {
          // 현재가 수평선
          ctx.strokeStyle = '#2962ff';
          ctx.lineWidth = 1;
          ctx.setLineDash([3, 3]);
          ctx.beginPath();
          ctx.moveTo(0, curY);
          ctx.lineTo(chartWidth, curY);
          ctx.stroke();
          ctx.setLineDash([]);

          // 우측 가격 뱃지
          ctx.fillStyle = '#2962ff';
          ctx.fillRect(chartWidth, curY - 10, rightSpace, 20);
          ctx.fillStyle = '#ffffff';
          ctx.font = 'bold 11px -apple-system, sans-serif';
          ctx.fillText(currentPrice.toFixed(1), chartWidth + 10, curY + 4);
        }
      }

      requestAnimationFrame(render);
    }

    // 렌더링 루프 시작
    requestAnimationFrame(render);
  </script>
</body>
</html>
