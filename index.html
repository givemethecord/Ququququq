<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BTCUSDT Chart & Order Book Map</title>
  <style>
    body { background-color: #131722; color: #d1d4dc; font-family: sans-serif; margin: 0; padding: 10px; }
    #status { padding: 6px; font-weight: bold; background: #2a2e39; margin-bottom: 8px; border-radius: 4px; font-size: 13px; text-align: center; }
    
    /* 차트 영역 설정 */
    .chart-container {
      width: 100%;
      height: 350px;
      margin-bottom: 10px;
      border-radius: 4px;
      overflow: hidden;
      background: #1e222d;
    }

    .container { display: flex; flex-direction: column; gap: 8px; }
    .board { background: #1e222d; padding: 8px; border-radius: 4px; }
    .row { 
      display: flex; 
      justify-content: space-between; 
      padding: 4px 6px; 
      font-family: monospace; 
      font-size: 13px; 
      position: relative; 
      z-index: 1;
      margin-bottom: 2px;
      border-radius: 2px;
    }
    .ask .price { color: #f23645; font-weight: bold; }
    .bid .price { color: #089981; font-weight: bold; }
  </style>
  <!-- 트레이딩뷰 차트 라이브러리 -->
  <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
</head>
<body>

  <div id="status">⚡ 실시간 연결 시도 중...</div>

  <!-- 트레이딩뷰 차트 -->
  <div class="chart-container" id="tradingview_chart"></div>

  <!-- 북맵 호가창 -->
  <div class="container">
    <div class="board">
      <div style="margin:0 0 6px 0; color:#f23645; font-weight:bold; font-size:13px;">매도 호가 (Asks)</div>
      <div id="asks"></div>
    </div>
    <div class="board">
      <div style="margin:0 0 6px 0; color:#089981; font-weight:bold; font-size:13px;">매수 호가 (Bids)</div>
      <div id="bids"></div>
    </div>
  </div>

  <script>
    // 1. 트레이딩뷰 위젯 로드 (바이낸스 BTCUSDT)
    new TradingView.widget({
      "autosize": true,
      "symbol": "BINANCE:BTCUSDT",
      "interval": "1",
      "timezone": "Asia/Seoul",
      "theme": "dark",
      "style": "1",
      "locale": "kr",
      "toolbar_bg": "#f1f3f6",
      "enable_publishing": false,
      "hide_top_toolbar": false,
      "save_image": false,
      "container_id": "tradingview_chart"
    });

    // 2. 바이낸스 웹소켓 호가 데이터 로드
    const statusEl = document.getElementById('status');
    const asksEl = document.getElementById('asks');
    const bidsEl = document.getElementById('bids');

    const ws = new WebSocket('wss://fstream.binance.com/ws/btcusdt@depth10@100ms');

    ws.onopen = () => {
      statusEl.innerText = "⚡ 차트 & 북맵 호가창 연결 성공";
      statusEl.style.color = "#089981";
    };

    ws.onmessage = (event) => {
      const data = JSON.parse(event.data);
      if (!data.bids || !data.asks) return;

      const allItems = [...data.bids, ...data.asks];
      const maxQty = Math.max(...allItems.map(item => parseFloat(item[1])));

      asksEl.innerHTML = data.asks.slice(0, 8).reverse().map(item => {
        const price = parseFloat(item[0]).toFixed(2);
        const qty = parseFloat(item[1]);
        const pct = Math.min(100, Math.max(5, (qty / maxQty) * 100));
        return `<div class="row ask" style="background: linear-gradient(90deg, transparent ${100-pct}%, rgba(242,54,69,0.25) ${100-pct}%);">
                  <span class="price">${price}</span>
                  <span>${qty.toFixed(3)}</span>
                </div>`;
      }).join('');

      bidsEl.innerHTML = data.bids.slice(0, 8).map(item => {
        const price = parseFloat(item[0]).toFixed(2);
        const qty = parseFloat(item[1]);
        const pct = Math.min(100, Math.max(5, (qty / maxQty) * 100));
        return `<div class="row bid" style="background: linear-gradient(90deg, transparent ${100-pct}%, rgba(8,153,129,0.25) ${100-pct}%);">
                  <span class="price">${price}</span>
                  <span>${qty.toFixed(3)}</span>
                </div>`;
      }).join('');
    };

    ws.onerror = () => { statusEl.innerText = "❌ 연결 에러"; };
    ws.onclose = () => { statusEl.innerText = "⚠️ 연결 종료"; };
  </script>
</body>
</html>
